<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Cofre Matemático - Semana da Matemática</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --cofre: #2c2c3a;
            --metal: #4a4a5a;
            --gold: #d4a843;
            --gold-light: #f0d078;
            --display-bg: #1a1a2e;
            --display-text: #00ff88;
            --acerto: #00e676;
            --erro: #ff3d3d;
            --dica: #ffab00;
            --btn: #3a3a50;
            --btn-hover: #505070;
            --text: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
            font-family: 'Segoe UI', 'JetBrains Mono', 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Partículas de fundo */
        .particulas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particula {
            position: absolute;
            background: var(--gold-light);
            border-radius: 50%;
            animation: flutuar linear infinite;
            opacity: 0;
        }
        @keyframes flutuar {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.5) rotate(720deg);
                opacity: 0;
            }
        }

        /* Container principal */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 95%;
            max-width: 600px;
            padding: 20px;
        }

        /* Título */
        .titulo {
            text-align: center;
            color: var(--gold);
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 40px rgba(212, 168, 67, 0.5), 0 2px 8px rgba(0, 0, 0, 0.7);
            animation: pulsar-titulo 2s ease-in-out infinite;
            line-height: 1.3;
        }
        .titulo .icone {
            font-size: 2.8rem;
            display: block;
            animation: tremer 0.5s ease-in-out infinite;
            animation-play-state: paused;
        }
        .titulo .icone.ativo {
            animation-play-state: running;
        }
        @keyframes pulsar-titulo {
            0%,
            100% {
                text-shadow: 0 0 40px rgba(212, 168, 67, 0.5), 0 2px 8px rgba(0, 0, 0, 0.7);
            }
            50% {
                text-shadow: 0 0 70px rgba(240, 208, 120, 0.9), 0 2px 16px rgba(0, 0, 0, 0.9);
            }
        }
        @keyframes tremer {
            0%,
            100% {
                transform: rotate(0deg);
            }
            15% {
                transform: rotate(8deg);
            }
            30% {
                transform: rotate(-6deg);
            }
            45% {
                transform: rotate(5deg);
            }
            60% {
                transform: rotate(-3deg);
            }
            75% {
                transform: rotate(2deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }
        .subtitulo {
            color: #8888aa;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* Cofre visual */
        .cofre-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            perspective: 800px;
        }
        .cofre {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .cofre.aberto {
            transform: rotateY(25deg) rotateX(-5deg) translateZ(30px);
        }
        .cofre-corpo {
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #3d3d55 0%, #252535 40%, #1a1a2a 100%);
            border-radius: 20px;
            margin: 10px auto;
            position: relative;
            border: 4px solid #555570;
            box-shadow: var(--shadow), inset 0 2px 10px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            transition: all 0.5s;
        }
        .cofre-corpo.abrindo {
            border-color: var(--gold);
            box-shadow: 0 0 60px rgba(212, 168, 67, 0.8), var(--shadow);
            animation: brilhar-cofre 0.6s ease-out;
        }
        @keyframes brilhar-cofre {
            0% {
                box-shadow: 0 0 0px rgba(212, 168, 67, 0), var(--shadow);
            }
            50% {
                box-shadow: 0 0 100px rgba(240, 208, 120, 1), var(--shadow);
            }
            100% {
                box-shadow: 0 0 60px rgba(212, 168, 67, 0.8), var(--shadow);
            }
        }
        .cofre-display {
            background: var(--display-bg);
            border-radius: 10px;
            padding: 10px 20px;
            border: 2px solid #333;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .digito-slot {
            width: 32px;
            height: 44px;
            background: #0d0d1a;
            border-radius: 6px;
            border: 1px solid #333;
            color: var(--display-text);
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            text-shadow: 0 0 12px var(--display-text);
            transition: all 0.3s;
        }
        .digito-slot.preenchido {
            color: #fff;
            text-shadow: 0 0 20px #fff, 0 0 40px var(--display-text);
            border-color: var(--display-text);
            animation: pop 0.4s ease-out;
        }
        @keyframes pop {
            0% {
                transform: scale(1.4);
            }
            100% {
                transform: scale(1);
            }
        }
        .cofre-roda {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #666 0%, #333 70%);
            border: 3px solid #777;
            position: relative;
            cursor: default;
            transition: transform 0.3s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .cofre-roda::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #222;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #555;
        }

        /* Painel de desafio */
        .painel {
            background: linear-gradient(160deg, #1e1e32 0%, #16162a 100%);
            border-radius: 20px;
            padding: 20px 24px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #333355;
            box-shadow: var(--shadow);
            transition: all 0.4s;
        }
        .painel.tremendo {
            animation: shake 0.5s ease-out;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-8px);
            }
            30% {
                transform: translateX(8px);
            }
            45% {
                transform: translateX(-5px);
            }
            60% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-2px);
            }
            100% {
                transform: translateX(0);
            }
        }
        .etapa-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge-etapa {
            background: var(--gold);
            color: #1a1a2e;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .pontuacao {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .enunciado {
            background: #111125;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 14px;
            border: 1px solid #2a2a45;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .enunciado-texto {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        .tipo-desafio {
            color: #aaa;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-resposta {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #444;
            background: #0d0d1a;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.3s;
            outline: none;
        }
        .input-resposta:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.3);
        }
        .input-resposta.correto {
            border-color: var(--acerto) !important;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.6) !important;
            animation: pop 0.3s ease-out;
        }
        .input-resposta.incorreto {
            border-color: var(--erro) !important;
            box-shadow: 0 0 25px rgba(255, 61, 61, 0.6) !important;
            animation: shake 0.4s ease-out;
        }
        .botoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .btn {
            padding: 12px 22px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-verificar {
            background: var(--gold);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(212, 168, 67, 0.4);
        }
        .btn-verificar:hover {
            background: var(--gold-light);
            box-shadow: 0 6px 25px rgba(240, 208, 120, 0.6);
        }
        .btn-dica {
            background: transparent;
            color: var(--dica);
            border: 2px solid var(--dica);
        }
        .btn-dica:hover {
            background: rgba(255, 171, 0, 0.1);
        }
        .btn-reiniciar {
            background: var(--btn);
            color: #ccc;
            border: 2px solid #555;
        }
        .btn-reiniciar:hover {
            background: var(--btn-hover);
        }
        .btn-proximo {
            background: var(--acerto);
            color: #0a0a0f;
            font-weight: 900;
            display: none;
        }
        .btn-proximo.visivel {
            display: inline-block;
        }
        .dicas-restantes {
            color: #888;
            font-size: 0.78rem;
            text-align: center;
            margin-top: 6px;
        }
        .mensagem {
            text-align: center;
            font-weight: 700;
            min-height: 24px;
            margin-top: 6px;
            transition: all 0.3s;
        }
        .mensagem.acerto {
            color: var(--acerto);
        }
        .mensagem.erro {
            color: var(--erro);
        }

        /* Tela de vitória */
        .overlay-vitoria {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        .overlay-vitoria.ativo {
            display: flex;
        }
        .card-vitoria {
            background: linear-gradient(160deg, #1e1e32, #16162a);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 3px solid var(--gold);
            box-shadow: 0 0 80px rgba(212, 168, 67, 0.7);
            animation: entrada-triunfal 0.7s ease-out;
            max-width: 420px;
            width: 90%;
        }
        @keyframes entrada-triunfal {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .card-vitoria h2 {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .card-vitoria .emoji-vitoria {
            font-size: 5rem;
            animation: bounce 0.6s ease-out infinite alternate;
        }
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-20px);
            }
        }
        .card-vitoria .pontuacao-final {
            font-size: 1.5rem;
            color: var(--gold-light);
            font-weight: 900;
        }

        /* Confetes */
        .confete {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            animation: cair-confete linear forwards;
        }
        @keyframes cair-confete {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsivo */
        @media (max-width: 400px) {
            .cofre-wrapper {
                width: 160px;
                height: 160px;
            }
            .cofre-corpo {
                width: 145px;
                height: 145px;
                border-radius: 16px;
            }
            .digito-slot {
                width: 24px;
                height: 34px;
                font-size: 1.2rem;
            }
            .cofre-roda {
                width: 36px;
                height: 36px;
            }
            .enunciado-texto {
                font-size: 1rem;
            }
            .btn {
                padding: 10px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Partículas de fundo -->
    <div class="particulas" id="particulas"></div>

    <!-- Container principal -->
    <div class="container">
        <!-- Título -->
        <div class="titulo">
            <span class="icone" id="iconeCofre">🔐</span>
            COFRE MATEMÁTICO
            <div class="subtitulo">Semana da Matemática</div>
        </div>

        <!-- Cofre visual -->
        <div class="cofre-wrapper">
            <div class="cofre" id="cofre3d">
                <div class="cofre-corpo" id="cofreCorpo">
                    <div class="cofre-display" id="cofreDisplay">
                        <div class="digito-slot" id="slot0">_</div>
                        <div class="digito-slot" id="slot1">_</div>
                        <div class="digito-slot" id="slot2">_</div>
                        <div class="digito-slot" id="slot3">_</div>
                        <div class="digito-slot" id="slot4">_</div>
                    </div>
                    <div class="cofre-roda" id="cofreRoda"></div>
                </div>
            </div>
        </div>

        <!-- Painel de desafio -->
        <div class="painel" id="painelDesafio">
            <div class="etapa-info">
                <span class="badge-etapa" id="badgeEtapa">ETAPA 1/5</span>
                <span class="pontuacao">⭐ <span id="pontuacao">0</span> pts</span>
            </div>
            <div class="tipo-desafio" id="tipoDesafio">ARITMÉTICA</div>
            <div class="enunciado">
                <span class="enunciado-texto" id="enunciadoTexto">Calcule: 27 + 15</span>
            </div>
            <div class="input-area">
                <input type="number" class="input-resposta" id="inputResposta" placeholder="Sua resposta" autocomplete="off">
                <button class="btn btn-verificar" id="btnVerificar">✓ Verificar</button>
            </div>
            <div class="botoes">
                <button class="btn btn-dica" id="btnDica">💡 Dica</button>
                <button class="btn btn-proximo" id="btnProximo">▶ Próximo desafio</button>
                <button class="btn btn-reiniciar" id="btnReiniciar">🔄 Reiniciar</button>
            </div>
            <div class="dicas-restantes" id="dicasRestantes">Dicas restantes: 3</div>
            <div class="mensagem" id="mensagem"></div>
        </div>
    </div>

    <!-- Overlay de vitória -->
    <div class="overlay-vitoria" id="overlayVitoria">
        <div class="card-vitoria">
            <div class="emoji-vitoria">🎉</div>
            <h2>COFRE ABERTO!</h2>
            <p style="color:#ccc;">Você desvendou todos os segredos matemáticos!</p>
            <p class="pontuacao-final">⭐ <span id="pontuacaoFinal">0</span> pontos</p>
            <p style="color:#aaa;font-size:0.85rem;">A matemática é a chave para todos os mistérios! 🔑</p>
            <button class="btn btn-verificar" style="margin-top:16px;" onclick="reiniciarJogo()">🔄 Jogar Novamente</button>
        </div>
    </div>

    <script>
        // ==================== JOGO COFRE MATEMÁTICO ====================

        // Estado do jogo
        const estado = {
            etapaAtual: 0, // 0 a 4
            totalEtapas: 5,
            senha: [], // dígitos da senha (0-9) - um para cada etapa
            descobertos: [null, null, null, null, null], // dígitos já descobertos
            pontuacao: 0,
            dicasRestantes: 3,
            jogoConcluido: false,
            desafioAtual: null, // objeto do desafio atual
            respondido: false, // se já respondeu a etapa atual
        };

        // Referências DOM
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const dom = {
            iconeCofre: $('#iconeCofre'),
            cofre3d: $('#cofre3d'),
            cofreCorpo: $('#cofreCorpo'),
            cofreRoda: $('#cofreRoda'),
            slots: $$('.digito-slot'),
            badgeEtapa: $('#badgeEtapa'),
            pontuacao: $('#pontuacao'),
            tipoDesafio: $('#tipoDesafio'),
            enunciadoTexto: $('#enunciadoTexto'),
            inputResposta: $('#inputResposta'),
            btnVerificar: $('#btnVerificar'),
            btnDica: $('#btnDica'),
            btnProximo: $('#btnProximo'),
            btnReiniciar: $('#btnReiniciar'),
            dicasRestantes: $('#dicasRestantes'),
            mensagem: $('#mensagem'),
            painelDesafio: $('#painelDesafio'),
            overlayVitoria: $('#overlayVitoria'),
            pontuacaoFinal: $('#pontuacaoFinal'),
        };

        // ==================== GERADORES DE DESAFIOS ====================

        function gerarDesafioAritmetica() {
            // Operações básicas: resultado deve ser um dígito (0-9) ou número pequeno
            const ops = [
                { sinal: '+', gerar: () => { const a = rand(2, 40); const b = rand(1, 9); return { expr: `${a} + ${b}`,
                        resp: a + b }; } },
                { sinal: '-', gerar: () => { const a = rand(10, 50); const b = rand(1, a - 1); return { expr: `${a} - ${b}`,
                        resp: a - b }; } },
                { sinal: '×', gerar: () => { const a = rand(2, 12); const b = rand(2, 9); return { expr: `${a} × ${b}`,
                        resp: a * b }; } },
                { sinal: '÷', gerar: () => { const b = rand(2, 9); const resp = rand(2, 10); const a = b * resp; return { expr: `${a} ÷ ${b}`,
                        resp: resp }; } },
            ];
            const op = ops[rand(0, ops.length - 1)];
            const resultado = op.gerar();
            // Garantir que a resposta seja um número positivo de até 2 dígitos
            if (resultado.resp < 0 || resultado.resp > 99) return gerarDesafioAritmetica();
            return {
                tipo: 'ARITMÉTICA',
                enunciado: `Calcule: ${resultado.expr}`,
                resposta: resultado.resp,
                dica: `Resolva a operação ${op.sinal}. O resultado é ${resultado.resp.toString().length} dígito(s).`,
            };
        }

        function gerarDesafioExpressao() {
            // Expressão com parênteses ou operações combinadas
            const padroes = [
                () => { const a = rand(2, 9); const b = rand(2, 9); const c = rand(1, 5); return { expr: `(${a} + ${b}) × ${c}`,
                        resp: (a + b) * c }; },
                () => { const a = rand(5, 20); const b = rand(2, 8); const c = rand(1, 5); return { expr: `${a} - (${b} × ${c})`,
                        resp: a - (b * c) }; },
                () => { const a = rand(3, 10); const b = rand(2, 6); const c = rand(2, 5); return { expr: `${a} × ${b} + ${c}`,
                        resp: a * b + c }; },
                () => { const a = rand(10, 30); const b = rand(2, 6); const c = rand(2, 5); return { expr: `${a} ÷ ${b} + ${c}`,
                        resp: Math.floor(a / b) + c, forcarInteiro: true }; },
            ];
            const padrao = padroes[rand(0, padroes.length - 1)];
            const resultado = padrao();
            if (resultado.resp < 0 || resultado.resp > 99) return gerarDesafioExpressao();
            if (resultado.forcarInteiro && !Number.isInteger(resultado.resp)) return gerarDesafioExpressao();
            return {
                tipo: 'EXPRESSÃO NUMÉRICA',
                enunciado: `Resolva: ${resultado.expr}`,
                resposta: Math.round(resultado.resp),
                dica: 'Lembre-se da ordem: parênteses primeiro, depois multiplicação/divisão, depois soma/subtração.',
            };
        }

        function gerarDesafioEquacao() {
            // Equação simples: ax + b = c  ou  ax - b = c
            const x = rand(1, 9);
            const a = rand(2, 6);
            const b = rand(1, 10);
            const tipo = rand(0, 1);
            let expr, resp;
            if (tipo === 0) {
                const c = a * x + b;
                expr = `${a}x + ${b} = ${c}`;
                resp = x;
            } else {
                const c = a * x - b;
                expr = `${a}x - ${b} = ${c}`;
                resp = x;
            }
            return {
                tipo: 'EQUAÇÃO ALGÉBRICA',
                enunciado: `Encontre x: ${expr}`,
                resposta: resp,
                dica: `Isole o x. Subtraia/adiciona ${b} dos dois lados, depois divida por ${a}.`,
            };
        }

        function gerarDesafioSequencia() {
            // Sequência ou padrão
            const padroes = [
                { seq: [2, 4, 6, 8], resp: 10, desc: 'PA razão +2' },
                { seq: [3, 6, 9, 12], resp: 15, desc: 'PA razão +3' },
                { seq: [1, 4, 9, 16], resp: 25, desc: 'Quadrados perfeitos' },
                { seq: [2, 4, 8, 16], resp: 32, desc: 'Potências de 2' },
                { seq: [1, 1, 2, 3, 5], resp: 8, desc: 'Fibonacci' },
                { seq: [10, 8, 6, 4], resp: 2, desc: 'PA razão -2' },
                { seq: [1, 3, 6, 10], resp: 15, desc: 'Números triangulares' },
            ];
            const p = padroes[rand(0, padroes.length - 1)];
            return {
                tipo: 'SEQUÊNCIA/PADRÃO',
                enunciado: `Qual o próximo número? ${p.seq.join(', ')} , ?`,
                resposta: p.resp,
                dica: `Observe o padrão: ${p.desc}.`,
            };
        }

        function gerarDesafioAleatorio() {
            const geradores = [
                gerarDesafioAritmetica,
                gerarDesafioExpressao,
                gerarDesafioEquacao,
                gerarDesafioSequencia,
            ];
            return geradores[rand(0, geradores.length - 1)]();
        }

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // ==================== LÓGICA DO JOGO ====================

        function gerarSenha() {
            // Gera 5 dígitos aleatórios para a senha
            const senha = [];
            for (let i = 0; i < estado.totalEtapas; i++) {
                senha.push(rand(0, 9));
            }
            return senha;
        }

        function iniciarJogo() {
            estado.etapaAtual = 0;
            estado.senha = gerarSenha();
            estado.descobertos = [null, null, null, null, null];
            estado.pontuacao = 0;
            estado.dicasRestantes = 3;
            estado.jogoConcluido = false;
            estado.respondido = false;
            atualizarDisplaySlots();
            atualizarPontuacao();
            atualizarDicas();
            dom.mensagem.textContent = '';
            dom.mensagem.className = 'mensagem';
            dom.btnProximo.classList.remove('visivel');
            dom.inputResposta.disabled = false;
            dom.inputResposta.value = '';
            dom.inputResposta.className = 'input-resposta';
            dom.btnVerificar.style.display = 'inline-block';
            dom.overlayVitoria.classList.remove('ativo');
            dom.cofre3d.classList.remove('aberto');
            dom.cofreCorpo.classList.remove('abrindo');
            dom.iconeCofre.classList.remove('ativo');
            dom.painelDesafio.classList.remove('tremendo');
            carregarEtapa(0);
            // Focar no input
            setTimeout(() => dom.inputResposta.focus(), 400);
        }

        function carregarEtapa(indice) {
            estado.etapaAtual = indice;
            estado.respondido = false;
            estado.desafioAtual = gerarDesafioAleatorio();
            // Garantir que a resposta seja um número inteiro positivo
            if (estado.desafioAtual.resposta < 0 || !Number.isInteger(estado.desafioAtual.resposta)) {
                estado.desafioAtual = gerarDesafioAritmetica();
            }
            dom.badgeEtapa.textContent = `ETAPA ${indice + 1}/${estado.totalEtapas}`;
            dom.tipoDesafio.textContent = estado.desafioAtual.tipo;
            dom.enunciadoTexto.textContent = estado.desafioAtual.enunciado;
            dom.inputResposta.value = '';
            dom.inputResposta.disabled = false;
            dom.inputResposta.className = 'input-resposta';
            dom.mensagem.textContent = '';
            dom.mensagem.className = 'mensagem';
            dom.btnProximo.classList.remove('visivel');
            dom.btnVerificar.style.display = 'inline-block';
            dom.painelDesafio.classList.remove('tremendo');
            setTimeout(() => dom.inputResposta.focus(), 300);
        }

        function verificarResposta() {
            if (estado.respondido || estado.jogoConcluido) return;

            const valorDigitado = dom.inputResposta.value.trim();
            if (valorDigitado === '') {
                dom.mensagem.textContent = 'Digite uma resposta!';
                dom.mensagem.className = 'mensagem erro';
                return;
            }

            const respostaJogador = parseInt(valorDigitado, 10);
            if (isNaN(respostaJogador)) {
                dom.mensagem.textContent = 'Resposta inválida! Digite um número.';
                dom.mensagem.className = 'mensagem erro';
                return;
            }

            const respostaCorreta = estado.desafioAtual.resposta;

            if (respostaJogador === respostaCorreta) {
                // ACERTO!
                estado.respondido = true;
                const digitoSenha = estado.senha[estado.etapaAtual];
                estado.descobertos[estado.etapaAtual] = digitoSenha;
                estado.pontuacao += 100;
                if (estado.dicasRestantes < 3 && estado.etapaAtual < estado.totalEtapas - 1) {
                    // bônus por não usar dica
                }
                atualizarDisplaySlots();
                atualizarPontuacao();
                dom.inputResposta.classList.add('correto');
                dom.mensagem.textContent = '✅ Correto! Dígito do cofre revelado!';
                dom.mensagem.className = 'mensagem acerto';
                dom.inputResposta.disabled = true;
                dom.btnVerificar.style.display = 'none';
                dom.btnProximo.classList.add('visivel');
                // Animação no slot
                const slot = document.getElementById(`slot${estado.etapaAtual}`);
                slot.classList.add('preenchido');
                // Girar roda do cofre
                dom.cofreRoda.style.transform = `rotate(${360 * (estado.etapaAtual + 1)}deg)`;
                // Verificar se completou todas as etapas
                if (estado.descobertos.every(d => d !== null)) {
                    setTimeout(abrirCofre, 800);
                } else {
                    setTimeout(() => dom.btnProximo.focus(), 300);
                }
            } else {
                // ERRO
                dom.inputResposta.classList.add('incorreto');
                dom.mensagem.textContent = '❌ Resposta incorreta. Tente novamente!';
                dom.mensagem.className = 'mensagem erro';
                dom.painelDesafio.classList.add('tremendo');
                estado.pontuacao = Math.max(0, estado.pontuacao - 20);
                atualizarPontuacao();
                setTimeout(() => {
                    dom.inputResposta.classList.remove('incorreto');
                    dom.painelDesafio.classList.remove('tremendo');
                }, 500);
                dom.inputResposta.select();
            }
        }

        function usarDica() {
            if (estado.respondido || estado.jogoConcluido) return;
            if (estado.dicasRestantes <= 0) {
                dom.mensagem.textContent = 'Sem dicas restantes! Pense bem...';
                dom.mensagem.className = 'mensagem erro';
                return;
            }
            estado.dicasRestantes--;
            estado.pontuacao = Math.max(0, estado.pontuacao - 15);
            atualizarDicas();
            atualizarPontuacao();
            dom.mensagem.textContent = `💡 Dica: ${estado.desafioAtual.dica}`;
            dom.mensagem.className = 'mensagem acerto';
            // Piscar a dica
            setTimeout(() => {
                if (dom.mensagem.textContent.includes('Dica:')) {
                    dom.mensagem.textContent = '';
                }
            }, 5000);
        }

        function proximaEtapa() {
            if (!estado.respondido) return;
            if (estado.jogoConcluido) return;
            const proxima = estado.etapaAtual + 1;
            if (proxima >= estado.totalEtapas) return;
            carregarEtapa(proxima);
        }

        function abrirCofre() {
            estado.jogoConcluido = true;
            dom.cofre3d.classList.add('aberto');
            dom.cofreCorpo.classList.add('abrindo');
            dom.iconeCofre.classList.add('ativo');
            dom.mensagem.textContent = '🔓 COFRE ABERTO! Parabéns!';
            dom.mensagem.className = 'mensagem acerto';
            dom.btnProximo.classList.remove('visivel');
            dom.btnVerificar.style.display = 'none';
            dom.inputResposta.disabled = true;
            // Mostrar overlay de vitória
            setTimeout(() => {
                dom.pontuacaoFinal.textContent = estado.pontuacao;
                dom.overlayVitoria.classList.add('ativo');
                criarConfetes();
            }, 1000);
        }

        function reiniciarJogo() {
            iniciarJogo();
        }

        function atualizarDisplaySlots() {
            for (let i = 0; i < estado.totalEtapas; i++) {
                const slot = document.getElementById(`slot${i}`);
                if (estado.descobertos[i] !== null) {
                    slot.textContent = estado.descobertos[i];
                    slot.classList.add('preenchido');
                } else {
                    slot.textContent = '_';
                    slot.classList.remove('preenchido');
                }
            }
        }

        function atualizarPontuacao() {
            dom.pontuacao.textContent = estado.pontuacao;
        }

        function atualizarDicas() {
            dom.dicasRestantes.textContent = `Dicas restantes: ${estado.dicasRestantes}`;
        }

        function criarConfetes() {
            const cores = ['#f0d078', '#ff6b6b', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd',
            '#00d2d3', '#feca57', '#ff9f43', '#ee5a24'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confete = document.createElement('div');
                    confete.classList.add('confete');
                    confete.style.left = Math.random() * 100 + '%';
                    confete.style.top = -(Math.random() * 40) + 'px';
                    confete.style.width = (Math.random() * 12 + 6) + 'px';
                    confete.style.height = (Math.random() * 12 + 6) + 'px';
                    confete.style.background = cores[Math.floor(Math.random() * cores.length)];
                    confete.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    confete.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confete.style.animationDelay = '0s';
                    document.body.appendChild(confete);
                    setTimeout(() => confete.remove(), 4000);
                }, i * 25);
            }
        }

        function criarParticulasFundo() {
            const container = $('#particulas');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.classList.add('particula');
                p.style.left = Math.random() * 100 + '%';
                p.style.width = (Math.random() * 4 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(p);
            }
        }

        // ==================== EVENTOS ====================

        dom.btnVerificar.addEventListener('click', verificarResposta);
        dom.btnDica.addEventListener('click', usarDica);
        dom.btnProximo.addEventListener('click', proximaEtapa);
        dom.btnReiniciar.addEventListener('click', reiniciarJogo);

        dom.inputResposta.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (estado.respondido && dom.btnProximo.classList.contains('visivel')) {
                    proximaEtapa();
                } else {
                    verificarResposta();
                }
            }
        });

        // Tecla de atalho para dica (D)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' && e.ctrlKey) {
                e.preventDefault();
                usarDica();
            }
            if (e.key === 'r' && e.ctrlKey) {
                e.preventDefault();
                reiniciarJogo();
            }
        });

        // ==================== INICIALIZAÇÃO ====================

        function init() {
            criarParticulasFundo();
            iniciarJogo();
        }

        init();

        console.log('🔐 Cofre Matemático - Semana da Matemática');
        console.log('Resolva os 5 desafios para revelar a senha do cofre!');
        console.log('Dica: Ctrl+D para usar dica | Ctrl+R para reiniciar');
        console.log('Senha atual (debug):', estado.senha.join(''));
    </script>
</body>
