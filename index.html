<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quiz Matematico - 3 Serie B</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --gold: #d4a843;
            --gold-light: #f0d078;
            --display-text: #00ff88;
            --acerto: #00e676;
            --erro: #ff3d3d;
            --dica: #ffab00;
            --btn: #3a3a50;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
            font-family: 'Segoe UI', 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .titulo {
            text-align: center;
            color: var(--gold);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 900;
            text-shadow: 0 0 25px rgba(212, 168, 67, 0.5);
        }
        .subtitulo {
            color: #8888aa;
            font-size: 0.9rem;
            text-align: center;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 8px 16px;
            border: 1px solid #333;
            flex-wrap: wrap;
            gap: 8px;
        }
        .cronometro-geral {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--display-text);
        }
        .vidas {
            display: flex;
            gap: 3px;
        }
        .vida {
            font-size: 1.4rem;
        }
        .pontuacao {
            color: var(--gold-light);
            font-weight: 900;
        }
        .dicas-restantes {
            color: #aaa;
            font-size: 0.8rem;
        }
        .cronometro-questao {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--display-text);
            text-shadow: 0 0 12px var(--display-text);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 18px;
            border-radius: 30px;
            border: 2px solid #333;
            align-self: center;
            transition: color 0.3s;
        }
        .cronometro-questao.urgente {
            color: var(--erro);
            animation: piscar 0.6s infinite;
        }
        @keyframes piscar {
            50% {
                opacity: 0.5;
            }
        }
        .progresso {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ccc;
            font-size: 0.9rem;
            padding: 0 5px;
        }
        .barra-progresso {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .barra-fill {
            height: 100%;
            background: var(--gold);
            transition: width 0.3s;
        }
        .questao-box {
            background: linear-gradient(160deg, #1e1e32, #16162a);
            border-radius: 20px;
            padding: 18px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .pergunta {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 700;
            text-align: center;
            word-break: break-word;
        }
        .alternativas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 400px) {
            .alternativas {
                grid-template-columns: 1fr;
            }
        }
        .btn-alternativa {
            background: var(--btn);
            color: #fff;
            border: 2px solid #555;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            word-break: break-word;
            touch-action: manipulation;
        }
        .btn-alternativa:active {
            transform: scale(0.96);
        }
        .btn-alternativa.correta {
            background: var(--acerto);
            border-color: var(--acerto);
            color: #000;
        }
        .btn-alternativa.incorreta {
            background: var(--erro);
            border-color: var(--erro);
        }
        .btn-alternativa:disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .mensagem {
            text-align: center;
            font-weight: 700;
            min-height: 20px;
            font-size: 0.9rem;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .overlay.escondido {
            display: none;
        }
        .card {
            background: linear-gradient(160deg, #1e1e32, #16162a);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            border: 2px solid var(--gold);
            max-width: 400px;
            width: 90%;
        }
        .btn-reiniciar {
            background: var(--gold);
            color: #0a0a0f;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 14px 30px;
            letter-spacing: 2px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.6);
            border: none;
            cursor: pointer;
        }
        .rodape {
            text-align: center;
            padding: 10px;
            color: #8888aa;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 10px;
        }
        .rodape span {
            color: var(--gold-light);
        }
    </style>
</head>
<body>
    <!-- Container do jogo (inicia automaticamente) -->
    <div class="container" id="jogoContainer">
        <div class="titulo">❓ QUIZ MATEMATICO</div>
        <div class="subtitulo">3 Serie B - Semana da Matematica</div>

        <div class="status-bar">
            <span class="vidas" id="vidas">❤️❤️❤️</span>
            <span class="pontuacao">⭐ <span id="pontuacao">0</span> 
        </div>

        <div class="progresso">
            <span>Questao <span id="qAtual">1</span>/10</span>
        </div>
        <div class="barra-progresso">
            <div class="barra-fill" id="barraFill" style="width:0%"></div>
        </div>

        <div class="cronometro-questao" id="cronometroQuestao">01:00</div>

        <div class="questao-box">
            <div class="pergunta" id="pergunta">Carregando...</div>
            <div class="alternativas" id="alternativas"></div>
            <div class="mensagem" id="mensagem"></div>
        </div>

        <footer class="rodape">
            3 Serie B | <span>Algebra In Foco 2k26</span> | Adalgisa Bonfim Soares
        </footer>
    </div>

    <!-- Tela de resultado final (inicia escondida) -->
    <div class="overlay escondido" id="telaResultado">
        <div class="card">
            <div style="font-size:4rem;" id="emojiResultado">🎉</div>
            <h2 style="color:var(--gold);">QUIZ CONCLUIDO!</h2>
            <p style="color:#ccc;">Pontuacao final:</p>
            <p style="color:var(--gold-light); font-size:2rem; font-weight:900;" id="pontFinal">0</p>
            <p style="color:#aaa;" id="msgResultado"></p>
            <button class="btn-reiniciar" onclick="reiniciar()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        const estado = {
            questaoAtual: 0,
            totalQuestoes: 10,
            pontuacao: 0,
            tempoRestanteQuestao: 60,
            timerQuestao: null,
            respondida: false,
            quizAcabou: false,
            questoes: [],
            vidas: 3,
            dicasRestantes: 3
        };

        const $ = id => document.getElementById(id);
        const dom = {
            jogoContainer: $('jogoContainer'),
            cronometroGeral: $('cronometroGeral'),
            qAtual: $('qAtual'),
            pontuacao: $('pontuacao'),
            barraFill: $('barraFill'),
            cronometroQuestao: $('cronometroQuestao'),
            pergunta: $('pergunta'),
            alternativas: $('alternativas'),
            mensagem: $('mensagem'),
            pontFinal: $('pontFinal'),
            msgResultado: $('msgResultado'),
            emojiResultado: $('emojiResultado'),
            vidas: $('vidas'),
            dicasRestantes: $('dicasRestantes'),
            telaResultado: $('telaResultado')
        };

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function embaralharArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function gerarQuestaoSoma() {
            const a = rand(10, 80),
                b = rand(10, 70);
            return { pergunta: `Quanto e ${a} + ${b}?`, respostaCorreta: a + b, tipo: 'soma' };
        }

        function gerarQuestaoSubtracao() {
            const a = rand(30, 100),
                b = rand(5, a - 5);
            return { pergunta: `Quanto e ${a} - ${b}?`, respostaCorreta: a - b, tipo: 'sub' };
        }

        function gerarQuestaoMultiplicacao() {
            const a = rand(2, 12),
                b = rand(2, 10);
            return { pergunta: `Quanto e ${a} x ${b}?`, respostaCorreta: a * b, tipo: 'multi' };
        }

        function gerarQuestaoDivisao() {
            const divisor = rand(2, 9),
                quociente = rand(3, 12);
            return { pergunta: `Quanto e ${divisor * quociente} / ${divisor}?`, respostaCorreta: quociente, tipo: 'div' };
        }

        function gerarQuestaoEquacao() {
            const x = rand(2, 12),
                coef = rand(2, 5),
                termo = rand(5, 20);
            return { pergunta: `Se ${coef}x + ${termo} = ${coef * x + termo}, qual o valor de x?`, respostaCorreta: x,
                tipo: 'eq' };
        }

        function gerarQuestaoMMC() {
            const a = rand(4, 15),
                b = rand(4, 15);
            const mdc = (x, y) => { while (y) { [x, y] = [y, x % y]; } return x; };
            return { pergunta: `Qual o MMC de ${a} e ${b}?`, respostaCorreta: (a * b) / mdc(a, b), tipo: 'mmc' };
        }

        function gerarQuestaoPorcentagem() {
            const valor = rand(50, 200),
                perc = rand(10, 40);
            return { pergunta: `Quanto e ${perc}% de ${valor}?`, respostaCorreta: Math.round(valor * perc / 100),
            tipo: 'pct' };
        }

        function gerarQuestaoPotencia() {
            const base = rand(2, 6),
                exp = rand(2, 4);
            return { pergunta: `Quanto e ${base} elevado a ${exp}?`, respostaCorreta: Math.pow(base, exp), tipo: 'pot' };
        }

        function gerarQuestaoRaiz() {
            const raiz = rand(2, 12);
            return { pergunta: `Qual a raiz quadrada de ${raiz * raiz}?`, respostaCorreta: raiz, tipo: 'raiz' };
        }

        function gerarQuestaoSequencia() {
            const sequencias = [
                { seq: '2, 4, 6, 8', resposta: 10 },
                { seq: '3, 6, 9, 12', resposta: 15 },
                { seq: '1, 4, 9, 16', resposta: 25 },
                { seq: '2, 4, 8, 16', resposta: 32 },
                { seq: '1, 1, 2, 3, 5', resposta: 8 }
            ];
            const e = sequencias[rand(0, sequencias.length - 1)];
            return { pergunta: `Qual o proximo numero: ${e.seq}, ?`, respostaCorreta: e.resposta, tipo: 'seq' };
        }

        function gerarQuestaoAleatoria() {
            const geradores = [gerarQuestaoSoma, gerarQuestaoSubtracao, gerarQuestaoMultiplicacao, gerarQuestaoDivisao,
                gerarQuestaoEquacao, gerarQuestaoMMC, gerarQuestaoPorcentagem, gerarQuestaoPotencia, gerarQuestaoRaiz,
                gerarQuestaoSequencia
            ];
            return geradores[rand(0, geradores.length - 1)]();
        }

        function gerarAlternativas(respostaCorreta, tipo) {
            const alternativas = new Set();
            alternativas.add(respostaCorreta);
            while (alternativas.size < 4) {
                let errada = tipo === 'seq' ? respostaCorreta + rand(-5, 5) : respostaCorreta + rand(-20, 20);
                if (errada !== respostaCorreta && errada > 0 && !alternativas.has(errada)) alternativas.add(errada);
            }
            return embaralharArray(Array.from(alternativas));
        }

        function formatarTempo(segundos) {
            const min = Math.floor(segundos / 60),
                seg = segundos % 60;
            return `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
        }

        function atualizarCronometroQuestao() {
            dom.cronometroQuestao.textContent = formatarTempo(estado.tempoRestanteQuestao);
            dom.cronometroQuestao.classList.toggle('urgente', estado.tempoRestanteQuestao <= 10);
        }

        function iniciarTimerQuestao() {
            estado.tempoRestanteQuestao = 60;
            atualizarCronometroQuestao();
            if (estado.timerQuestao) clearInterval(estado.timerQuestao);
            estado.timerQuestao = setInterval(() => {
                estado.tempoRestanteQuestao--;
                atualizarCronometroQuestao();
                if (estado.tempoRestanteQuestao <= 0) {
                    clearInterval(estado.timerQuestao);
                    if (!estado.respondida && !estado.quizAcabou) tempoEsgotadoQuestao();
                }
            }, 1000);
        }

        function pararTimerQuestao() {
            if (estado.timerQuestao) { clearInterval(estado.timerQuestao);
                estado.timerQuestao = null; }
        }

        function tempoEsgotadoQuestao() {
            if (estado.respondida) return;
            estado.respondida = true;
            pararTimerQuestao();
            const botoes = document.querySelectorAll('.btn-alternativa');
            botoes.forEach(btn => {
                btn.disabled = true;
                if (parseInt(btn.dataset.valor) === estado.questoes[estado.questaoAtual].respostaCorreta) btn
                    .classList.add('correta');
            });
            dom.mensagem.innerHTML = '⏰ Tempo esgotado!';
            dom.mensagem.style.color = 'var(--erro)';
            estado.vidas--;
            atualizarVidas();
            if (estado.vidas <= 0) setTimeout(finalizarQuiz, 1500);
            else setTimeout(proximaQuestao, 1500);
        }

        function atualizarVidas() {
            dom.vidas.innerHTML = '❤️'.repeat(estado.vidas) + '🖤'.repeat(3 - estado.vidas);
        }

        function mostrarQuestao() {
            if (estado.questaoAtual >= estado.totalQuestoes || estado.quizAcabou) { finalizarQuiz(); return; }
            estado.respondida = false;
            const questao = estado.questoes[estado.questaoAtual];
            dom.pergunta.textContent = questao.pergunta;
            dom.alternativas.innerHTML = '';
            questao.alternativas.forEach(valor => {
                const btn = document.createElement('button');
                btn.className = 'btn-alternativa';
                btn.textContent = valor;
                btn.dataset.valor = valor;
                btn.addEventListener('click', () => selecionarResposta(valor));
                dom.alternativas.appendChild(btn);
            });
            dom.mensagem.textContent = '';
            dom.qAtual.textContent = estado.questaoAtual + 1;
            dom.barraFill.style.width = ((estado.questaoAtual) / estado.totalQuestoes * 100) + '%';
            iniciarTimerQuestao();
        }

        function selecionarResposta(valorEscolhido) {
            if (estado.respondida || estado.quizAcabou) return;
            estado.respondida = true;
            pararTimerQuestao();
            const questao = estado.questoes[estado.questaoAtual];
            const botoes = document.querySelectorAll('.btn-alternativa');
            botoes.forEach(btn => {
                btn.disabled = true;
                if (parseInt(btn.dataset.valor) === questao.respostaCorreta) btn.classList.add('correta');
            });
            const btnEscolhido = Array.from(botoes).find(b => parseInt(b.dataset.valor) === valorEscolhido);
            if (valorEscolhido === questao.respostaCorreta) {
                const pontosGanhos = Math.floor(900 * (estado.tempoRestanteQuestao / 60));
                estado.pontuacao += pontosGanhos;
                dom.pontuacao.textContent = estado.pontuacao;
                dom.mensagem.innerHTML = `✅ Correto! +${pontosGanhos} pts`;
                dom.mensagem.style.color = 'var(--acerto)';
            } else {
                if (btnEscolhido) btnEscolhido.classList.add('incorreta');
                estado.vidas--;
                atualizarVidas();
                dom.mensagem.innerHTML = '❌ Errado!';
                dom.mensagem.style.color = 'var(--erro)';
                if (estado.vidas <= 0) { setTimeout(finalizarQuiz, 1500); return; }
            }
            setTimeout(proximaQuestao, 1500);
        }

        function proximaQuestao() {
            estado.questaoAtual++;
            if (estado.questaoAtual >= estado.totalQuestoes) finalizarQuiz();
            else mostrarQuestao();
        }

        function finalizarQuiz() {
            estado.quizAcabou = true;
            pararTimerQuestao();
            dom.telaResultado.classList.remove('escondido');
            dom.pontFinal.textContent = estado.pontuacao;
            if (estado.pontuacao >= 7000) {
                dom.emojiResultado.textContent = '🏆';
                dom.msgResultado.textContent = 'Excelente! Voce e um mestre da matematica!';
            } else if (estado.pontuacao >= 4000) {
                dom.emojiResultado.textContent = '🎉';
                dom.msgResultado.textContent = 'Muito bom! Continue praticando.';
            } else {
                dom.emojiResultado.textContent = '📚';
                dom.msgResultado.textContent = 'Estude mais e tente novamente!';
            }
        }

        function reiniciar() {
            estado.questaoAtual = 0;
            estado.pontuacao = 0;
            estado.vidas = 3;
            estado.dicasRestantes = 3;
            estado.respondida = false;
            estado.quizAcabou = false;
            estado.questoes = [];
            for (let i = 0; i < estado.totalQuestoes; i++) {
                const q = gerarQuestaoAleatoria();
                estado.questoes.push({
                    pergunta: q.pergunta,
                    respostaCorreta: q.respostaCorreta,
                    alternativas: gerarAlternativas(q.respostaCorreta, q.tipo)
                });
            }
            dom.pontuacao.textContent = '0';
            dom.barraFill.style.width = '0%';
            atualizarVidas();
            dom.dicasRestantes.textContent = estado.dicasRestantes;
            dom.telaResultado.classList.add('escondido');
            mostrarQuestao();
        }

        // Iniciar automaticamente
        reiniciar();
    </script>
</body>
</html>
